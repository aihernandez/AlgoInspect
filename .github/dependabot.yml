version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Las herramientas de construcción se actualizan juntas: revisarlas por
      # separado multiplica el ruido sin aportar información.
      build-tooling:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "@playwright/*"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
